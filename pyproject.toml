[build-system]
# 需要 >=77 才能用 SPDX 形式的 license 与 license-files（PEP 639），
# 否则 setuptools 会打印弃用警告，且 2027-02 之后不再支持旧写法。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mining-brief-mcp"
version = "0.1.0"
description = "MCP-based daily briefing agent for mining projects (矿权日报 Agent)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dj" }]
keywords = ["mcp", "agent", "mining", "llm", "ni43-101"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

dependencies = [
  # 固定 1.x：mcp 2.x 把 FastMCP 更名为 MCPServer，且客户端字段改为 snake_case、
  # call_tool 出错时改抛异常。生态（Claude Desktop / Cursor）与公开文档目前仍以 1.x 为主，
  # 为保持"新机器 5 分钟跑起来"的稳定性，这里显式锁定 <2。迁移到 2.x 见 docs/architecture.md。
  "mcp>=1.2.0,<2",
  # 其余依赖统一给上界：本项目承诺「克隆下来就能跑」，不能因为上游发一个大版本
  # 就让新用户装出一个跑不起来的组合。实测 openai 3.x 仍兼容本项目的调用方式。
  "httpx>=0.27.0,<1",
  "feedparser>=6.0.11,<7",
  "pdfplumber>=0.11.0,<1",
  "pydantic>=2.7.0,<3",
  "openai>=1.40.0,<4",
  "python-dotenv>=1.0.1,<2",
  "tenacity>=8.3.0,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/ding16-ai/mining-brief-mcp"
Repository = "https://github.com/ding16-ai/mining-brief-mcp"
Issues = "https://github.com/ding16-ai/mining-brief-mcp/issues"

[project.scripts]
mining-brief = "mining_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed 是 PEP 561 标记：没有它，下游装了本包也拿不到类型信息，
# classifiers 里的 "Typing :: Typed" 就只是一句空话。
mining_brief = ["fixtures/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
strict = true
show_error_codes = true
warn_unused_configs = true
pretty = true

# 这两个库没有发布类型信息，且本项目只用到很浅的接口，跳过对它们内部的检查。
[[tool.mypy.overrides]]
module = ["feedparser.*", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 刻意不把 --cov 放进 addopts：只装了运行时依赖的人跑 pytest 不应该报错。
# 覆盖率由 CI 与 `make cov` 显式开启。
addopts = "-q"

[tool.coverage.run]
source = ["mining_brief"]
branch = true

[tool.coverage.report]
show_missing = true
# 门槛定在 60：当前实测 65%，留出余量，避免不同 Python 版本/平台的细微差异把 CI 卡红。
# 未覆盖的部分主要是联网取数与 LLM 调用分支 —— 这些在离线 CI 里无法执行，
# 但它们由 tests/test_servers_offline.py 通过真实 stdio 子进程做了端到端验证。
fail_under = 60
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
